name: patient_app
description: "CogniCompanion Patient Mobile & Tablet App — Voice-first and Cognitive Gaming for Dementia Care."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/l10n/
