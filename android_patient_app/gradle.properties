# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings in your home directory.

# JVM memory and performance settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

# Disable AAPT2 daemon mode to avoid Windows UCRT crash (AAPT2 runs in-process instead)
android.aapt2DaemonModeEnabled=false

# AndroidX and Jetpack Compose flags
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ─────────────────────────────────────────────────────────────────────────────
# CogniCompanion API Configuration
# ─────────────────────────────────────────────────────────────────────────────
# For Android Emulator: "http://10.0.2.2:8000/api/v1/"
# For Physical Device (via adb reverse): "http://localhost:8000/api/v1/"
# For Physical Device (same Wi-Fi): "http://<YOUR_LAN_IP>:8000/api/v1/"
# For Production: "https://api.yourdomain.com/api/v1/"
# Replace with your machine's LAN IP (run `ipconfig` on Windows / `ifconfig` on Linux-Mac).
# Do NOT commit a real IP here — it leaks network topology.
COGNI_DEBUG_API_BASE_URL=http://YOUR_LAN_IP:8000/api/v1/

COGNI_API_BASE_URL=https://api.example.com/api/v1/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
